# ---------------------------------------------------------------------
# Perfil TEST - usado solo por las pruebas automatizadas.
# Los valores de seguridad son ficticios: las pruebas simulan los tokens
# con .with(jwt()), por lo que no se contacta a Microsoft Entra ID.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

app.security.tenant-subdomain=test
app.security.tenant-id=00000000-0000-0000-0000-000000000000
app.security.issuer-uri=https://test.ciamlogin.com/00000000-0000-0000-0000-000000000000/v2.0
app.security.jwk-set-uri=https://test.ciamlogin.com/00000000-0000-0000-0000-000000000000/discovery/v2.0/keys
app.security.audiences=api://test-client-id

app.cors.allowed-origins=http://localhost:5173
