# ---------------------------------------------------------------------
# Perfil DEMO - base de datos H2 en memoria
# Permite levantar el microservicio sin instalar MySQL.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:innovatech;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de la base de datos: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga los datos iniciales de data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
