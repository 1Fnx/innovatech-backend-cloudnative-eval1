spring.application.name=ms-productos
server.port=8081

# Perfil activo:
#   demo  -> base de datos H2 en memoria (no requiere instalar nada)
#   cloud -> base de datos MySQL en la nube
spring.profiles.active=demo

# =====================================================================
# SEGURIDAD - Microsoft Entra External ID
# =====================================================================

# Subdominio del tenant (lo previo a .onmicrosoft.com)
app.security.tenant-subdomain=195a9a2b-7458-48e9-b93d-8667f389ab8c

# Directory (tenant) ID
app.security.tenant-id=195a9a2b-7458-48e9-b93d-8667f389ab8c

# Issuer esperado del token (claim iss)
app.security.issuer-uri=https://195a9a2b-7458-48e9-b93d-8667f389ab8c.ciamlogin.com/195a9a2b-7458-48e9-b93d-8667f389ab8c/

# Endpoint JWKS: claves publicas para verificar la firma del token
app.security.jwk-set-uri=https://195a9a2b-7458-48e9-b93d-8667f389ab8c.ciamlogin.com/195a9a2b-7458-48e9-b93d-8667f389ab8c/discovery/v2.0/keys

# Audiencia aceptada (Application ID URI del backend en "Exponer una API").
# Se pueden indicar varias separadas por coma.
app.security.audiences=api://6fd02921-82d8-4677-9495-8d0b20f0ac07

# =====================================================================
# CORS - origenes autorizados del frontend
# =====================================================================
app.cors.allowed-origins=http://localhost:5173

# =====================================================================
# Registro
# =====================================================================
logging.level.org.springframework.security=INFO
